name: Atualizar taxas e preços da Ton

# Confere as taxas e os preços no site da Ton e atualiza lib/taxas.ts e lib/precos.ts.
# Roda no dia 1 de cada mês; também pode ser disparado à mão na aba Actions.
on:
  schedule:
    - cron: "0 9 1 * *" # dia 1, 6h no horário de Brasília
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/atualizar-taxas.yml"
      - "scripts/atualizar_taxas.py"
      - "scripts/atualizar_precos.mjs"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler as taxas na página da Ton
        run: python3 scripts/atualizar_taxas.py

      - name: Ler os preços e o cupom de parceiro no catálogo da Ton
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core@24 || echo "sem navegador: o cupom fica como estava"
          node scripts/atualizar_precos.mjs

      - name: Registrar a atualização, se algo mudou
        run: |
          if git diff --quiet lib/taxas.ts lib/precos.ts; then
            echo "Nada mudou."
            exit 0
          fi
          if git diff lib/taxas.ts lib/precos.ts | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -qvE 'TAXAS_ULTIMA_VERIFICACAO|PRECOS_CONFERIDO_EM|CUPOM_CONFERIDO_EM|// DADOS'; then
            MSG="Taxas e preços da Ton atualizados automaticamente"
          else
            MSG="Taxas e preços da Ton conferidos automaticamente: sem mudança"
          fi
          git config user.name "offondigital"
          git config user.email "258330189+offondigital@users.noreply.github.com"
          git add lib/taxas.ts lib/precos.ts
          git commit -m "$MSG"
          git push
